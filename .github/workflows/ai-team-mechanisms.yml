name: AI Team mechanisms

# Copy this adopter-owned workflow to .github/workflows/. It deliberately
# runs the complete mounted package suite on every pull request: path filters
# would make its check name conditional and let a later gate baseline lie.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-team-mechanisms-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    name: Mechanism tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the adopter
        uses: actions/checkout@v5

      - name: Run the mounted mechanism suite
        run: python3 -m unittest discover -s docs/ai-team/scripts -p 'test_*.py'

      # The command and policy are adopter-owned copies. Keep their provenance
      # mechanical so a future package refresh cannot leave session lifecycle
      # instructions and the executable entry point disagreeing again.
      - name: Verify the adopter package-refresh entry point
        run: |
          test ! -e .ai-team/activate.sh
          test -x .ai-team/package-refresh.sh
          cmp docs/ai-team/templates/package-refresh.sh .ai-team/package-refresh.sh
          cmp docs/ai-team/templates/package-refresh.conf .ai-team/package-refresh.conf

  shell:
    name: Shell lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the adopter
        uses: actions/checkout@v5

      - name: Run shellcheck over the mounted mechanisms
        run: shellcheck --severity=error docs/ai-team/scripts/*.sh

      # Adopter-owned addition, deliberately diverging from the template: the
      # mounted scripts arrive already linted by the package's own CI, whereas
      # .ai-team/ is the hand-written half nobody else checks. Linting only the
      # mount left the one file this repository actually authored uncovered.
      - name: Run shellcheck over the adopter-owned hooks
        run: shellcheck --severity=error .ai-team/*.sh
