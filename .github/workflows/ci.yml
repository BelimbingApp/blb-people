name: ci

# Thin caller for the BLB People Domain. All build/test/scan logic
# lives once in the platform repo's reusable domain-ci workflow; this repo only
# declares its contract path and SonarCloud identity.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Run independently of repository changes so a moving platform main cannot
  # turn this domain red silently between pull requests. GitHub cron is UTC.
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:

jobs:
  ci:
    uses: BelimbingApp/belimbing/.github/workflows/domain-ci.yml@main
    with:
      domain-path: app/Domains/People
      sonar-project-key: BelimbingApp_blb-people
      sonar-organization: belimbingapp
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
