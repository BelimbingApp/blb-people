name: ci

# Thin caller for the BLB People Domain. All build/test/scan logic
# lives once in the platform repo's reusable domain-ci workflow; this repo only
# declares its contract path and SonarCloud identity.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Run independently of repository changes so month-boundary regressions and
  # future platform-ref drift are detected by a dedicated signal. GitHub cron
  # is UTC; two runs per day cover every calendar boundary.
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:

jobs:
  ci:
    uses: BelimbingApp/belimbing/.github/workflows/domain-ci.yml@3ae1aefba6cc152a792050bd98601c2e1254cf0d
    with:
      domain-path: app/Domains/People
      platform-ref: 3ae1aefba6cc152a792050bd98601c2e1254cf0d
      sonar-project-key: BelimbingApp_blb-people
      sonar-organization: belimbingapp
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
